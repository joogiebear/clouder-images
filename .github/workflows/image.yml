name: image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning ${{ inputs.image }}/entrypoint.sh test/${{ inputs.image }}.sh
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.image }}/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.image }}
          load: true
          tags: ${{ inputs.image }}:test
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
      - name: Smoke test
        run: bash test/${{ inputs.image }}.sh ${{ inputs.image }}:test
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        if: inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.image }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ inputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/joogiebear/clouder-${{ inputs.image }}:1
            ghcr.io/joogiebear/clouder-${{ inputs.image }}:sha-${{ github.sha }}
      - name: Show the reference to pin
        if: inputs.publish
        run: echo "ghcr.io/joogiebear/clouder-${{ inputs.image }}:1@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
