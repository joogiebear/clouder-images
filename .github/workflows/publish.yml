name: publish

# Builds each image and pushes it to GitHub Container Registry. It runs when an image folder
# changes on main, or by hand. The job summary prints the full reference with its digest, which
# is what the ClouderNode panel pins.
on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: rust
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/joogiebear/clouder-rust:1
            ghcr.io/joogiebear/clouder-rust:sha-${{ github.sha }}
      - name: Show the reference to pin
        run: |
          echo "ghcr.io/joogiebear/clouder-rust:1@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
