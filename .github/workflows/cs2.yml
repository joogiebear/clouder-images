name: cs2

on:
  push:
    branches: [main]
    paths:
      - "cs2/**"
      - "test/cs2.sh"
      - ".hadolint.yaml"
      - ".github/workflows/cs2.yml"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "cs2/**"
      - "test/cs2.sh"
      - ".hadolint.yaml"
      - ".github/workflows/cs2.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: cs2
      publish: ${{ github.event_name != 'pull_request' }}
